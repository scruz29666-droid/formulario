<!DOCTYPE html>
<html>

        <title> Formulario de Contactos</title>
        <link rel="stylesheet" type="text/css" href="estilos.css">

        <div class="form">

                <textarea name="mensaje" placeholder="Mensaje"

                <br>
                <input type="submit" value="Enviar">
            </form>
        </div>
